<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Internal HR & Payroll management tool — manage employees, leave requests, and payroll." />
  <title>ATLAS-HR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">HR</div>
      <div class="logo-text">
        <span class="logo-name">ATLAS-HR</span>
        <span class="logo-sub">People &amp; Payroll</span>
      </div>
    </div>
    <nav class="sidebar-nav" role="navigation" aria-label="Main navigation">
      <button class="nav-item active" id="nav-dashboard" data-tab="dashboard" aria-current="page">
        <span>Dashboard</span>
      </button>
      <button class="nav-item" id="nav-employees" data-tab="employees">
        <span>Employees</span>
      </button>
      <button class="nav-item" id="nav-org" data-tab="org">
        <span>Org Chart</span>
      </button>
      <button class="nav-item" id="nav-leave" data-tab="leave">
        <span>Leave</span>
        <span class="nav-badge" id="leave-badge" style="display:none"></span>
      </button>
      <button class="nav-item" id="nav-payroll" data-tab="payroll">
        <span>Payroll</span>
      </button>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="avatar">AM</div>
        <div class="user-info">
          <span class="user-name">Alice Mwangi</span>
          <span class="user-role">CEO · Admin</span>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main" id="main-content">
    <section id="tab-dashboard" class="tab-section active" aria-label="Dashboard">
      <div class="page-header">
        <div>
          <h1 class="page-title">Dashboard</h1>
          <p class="page-subtitle" id="dashboard-date"></p>
        </div>
      </div>
    </section>

    <!-- Employees Tab -->
    <section id="tab-employees" class="tab-section" aria-label="Employees">
      <div class="page-header">
        <div>
          <h1 class="page-title">Employees</h1>
          <p class="page-subtitle">Manage your team</p>
        </div>
        <div class="header-actions">
          <label class="toggle-label">
            <input type="checkbox" id="toggle-inactive" /> Show inactive
          </label>
          <button class="btn btn-primary" id="btn-add-employee">
            <span>Add Employee</span>
          </button>
        </div>
      </div>
      <div class="card">
        <div class="search-bar">
          <input type="search" id="employee-search" placeholder="Search by name, role, department…" class="search-input" />
        </div>
        <div id="employees-table-wrap" class="table-wrap"><div class="empty-state"><span class="spinner"></span></div></div>
      </div>
    </section>

    <section id="tab-org" class="tab-section" aria-label="Org Chart"></section>
    <section id="tab-leave" class="tab-section" aria-label="Leave Management"></section>
    <section id="tab-payroll" class="tab-section" aria-label="Payroll"></section>
  </main>

  <!-- Add/Edit Employee Modal -->
  <div class="modal-backdrop" id="modal-employee" role="dialog" aria-modal="true" aria-labelledby="modal-employee-title" style="display:none">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title" id="modal-employee-title">Add Employee</h2>
        <button class="modal-close" id="close-modal-employee" aria-label="Close">&times;</button>
      </div>
      <form id="form-employee" class="modal-body">
        <div class="form-grid">
          <div class="form-group"><label for="emp-name">Full Name *</label><input type="text" id="emp-name" name="name" required /></div>
          <div class="form-group"><label for="emp-email">Email *</label><input type="email" id="emp-email" name="email" required /></div>
          <div class="form-group"><label for="emp-role">Role / Title *</label><input type="text" id="emp-role" name="role" required /></div>
          <div class="form-group"><label for="emp-dept">Department *</label><input type="text" id="emp-dept" name="department" required /></div>
          <div class="form-group"><label for="emp-manager">Manager</label><select id="emp-manager" name="manager_id"><option value="">— None (top level) —</option></select></div>
          <div class="form-group"><label for="emp-start">Start Date *</label><input type="date" id="emp-start" name="start_date" required /></div>
          <div class="form-group"><label for="emp-salary">Monthly Salary *</label><input type="number" id="emp-salary" name="salary" min="1" step="0.01" required /></div>
          <div class="form-group"><label for="emp-type">Employment Type *</label>
            <select id="emp-type" name="employment_type" required>
              <option value="full-time">Full-time</option><option value="part-time">Part-time</option><option value="contract">Contract</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" id="cancel-modal-employee">Cancel</button>
          <button type="submit" class="btn btn-primary" id="submit-employee-btn">Add Employee</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast-container" aria-live="polite" aria-atomic="true"></div>
  <script src="app.js"></script>
</body>
</html>
